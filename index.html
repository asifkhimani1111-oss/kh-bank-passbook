
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K.H Bank Passbook</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f6fc;color:#172554}
header{background:#1455a0;color:white;padding:22px 16px;text-align:center}
main{max-width:520px;margin:18px auto;padding:12px}
.card{background:white;padding:18px;border-radius:14px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
.balance{background:#1455a0;color:white}
.balance h2{margin:8px 0;font-size:30px}
input,select,button{width:100%;padding:12px;margin-top:9px;border:1px solid #ccd5e3;border-radius:8px;font-size:16px}
button{background:#1455a0;color:white;border:0;font-weight:bold}
button.secondary{background:#168343}
.small{font-size:13px;color:#64748b}
#transactions p{border-bottom:1px solid #eee;padding-bottom:9px}
</style>
</head>
<body>
<header>
  <h1>K.H Bank Passbook</h1>
  <p>તમારી આવક અને ખર્ચનો હિસાબ</p>
</header>
<main>
  <section class="card balance">
    <p>ડેમો બેલેન્સ</p>
    <h2 id="balance">₹0</h2>
    <p>આ વાસ્તવિક બેંક બેલેન્સ નથી.</p>
  </section>

  <section class="card">
    <h3>નવી એન્ટ્રી ઉમેરો</h3>
    <label for="note">વિગત</label>
    <input id="note" placeholder="ઉદાહરણ: પગાર અથવા ખરીદી">
    <label for="amount">રકમ (₹)</label>
    <input id="amount" type="number" min="1" step="0.01" placeholder="રકમ લખો">
    <label for="type">એન્ટ્રીનો પ્રકાર</label>
    <select id="type">
      <option value="in">જમા / આવક</option>
      <option value="out">ઉપાડ / ખર્ચ</option>
    </select>
    <button onclick="addEntry()">એન્ટ્રી ઉમેરો</button>
    <button class="secondary" onclick="testSound()">🔔 અવાજ ચકાસો</button>
    <p class="small">આ ડેમોમાં દાખલ કરેલી એન્ટ્રીઓ ફક્ત આ બ્રાઉઝરમાં રહે છે.</p>
  </section>

  <section class="card">
    <h3>ટ્રાન્ઝેક્શન હિસ્ટરી</h3>
    <div id="transactions">હજુ કોઈ એન્ટ્રી નથી.</div>
  </section>
</main>

<script>
let entries = [];
let balance = 0;

function money(n){
  return "₹" + n.toLocaleString("en-IN",{maximumFractionDigits:2});
}

function testSound(){
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx){ alert("આ બ્રાઉઝરમાં અવાજ ઉપલબ્ધ નથી."); return; }
    const ctx = new Ctx();
    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();
    oscillator.connect(gain);
    gain.connect(ctx.destination);
    oscillator.frequency.value = 880;
    gain.gain.value = 0.12;
    oscillator.start();
    oscillator.stop(ctx.currentTime + 0.2);
    oscillator.onended = () => ctx.close();
  } catch(e) {
    alert("અવાજ ચાલુ થઈ શક્યો નથી.");
  }
}

function addEntry(){
  const note = document.getElementById("note").value.trim();
  const amount = Number(document.getElementById("amount").value);
  const type = document.getElementById("type").value;

  if(!note || !Number.isFinite(amount) || amount <= 0){
    alert("વિગત અને યોગ્ય રકમ લખો.");
    return;
  }

  balance += type === "in" ? amount : -amount;
  entries.unshift({note, amount, type, date:new Date().toLocaleString("gu-IN")});

  document.getElementById("balance").textContent = money(balance);
  const list = document.getElementById("transactions");
  list.replaceChildren();

  entries.forEach(entry => {
    const p = document.createElement("p");
    p.textContent =
      (entry.type === "in" ? "🟢 જમા +" : "🔴 ખર્ચ −") +
      money(entry.amount) + " — " + entry.note + " (" + entry.date + ")";
    list.appendChild(p);
  });

  document.getElementById("note").value = "";
  document.getElementById("amount").value = "";
  testSound();
}
</script>
</body>
</html>
